server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

rabbitmq:
  exchange: expense.exchange
  queue: budget.alerts.queue
  routing-key: expense.created
  consumer:
    retry-attempts: ${BUDGET_ALERT_RETRY_ATTEMPTS:3}
    retry-delay-ms: ${BUDGET_ALERT_RETRY_DELAY_MS:2000}

expense-service:
  base-url: ${EXPENSE_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: ${EXPENSE_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${EXPENSE_SERVICE_READ_TIMEOUT_MS:5000}
