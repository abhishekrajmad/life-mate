version: '3.8'

services:
  # =========================================================================
  # PostgreSQL 15 - Primary Relational Database for expense-service
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: lifemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifemate_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lifemate_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lifemate-network

  # =========================================================================
  # Redis 7 - In-Memory Store for API Gateway Rate Limiting & Caching
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: lifemate-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lifemate-network

  # =========================================================================
  # RabbitMQ 3 (with Management UI) - Asynchronous Event Message Broker
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lifemate-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672" # AMQP protocol port
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # RabbitMQ Management Web Console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - lifemate-network

# ===========================================================================
# Persistent Storage Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ===========================================================================
# Shared Bridge Network
# ===========================================================================
networks:
  lifemate-network:
    driver: bridge
